server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${DATABASE_USERNAME:nexus}
spring.datasource.password=${DATABASE_PASSWORD:nexus_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
nexus.demo=${NEXUS_DEMO:false}
nexus.demo-password=${DEMO_PASSWORD:}
nexus.admin-password=${ADMIN_PASSWORD:}
nexus.email.enabled=${EMAIL_ENABLED:false}
nexus.email.key=${RESEND_API_KEY:}
nexus.email.from=${EMAIL_FROM:}
nexus.email.recipient=${EMAIL_TEST_RECIPIENT:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.properties.hibernate.default_batch_fetch_size=64
